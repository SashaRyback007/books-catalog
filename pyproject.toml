[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "books-catalog"
version = "0.1.0"
description = "Система обліку книг (Лабораторна робота №6, варіант 2)"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "strict"
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=books",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "integration: integration tests",
]

[tool.coverage.run]
branch = true
source = ["books"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80